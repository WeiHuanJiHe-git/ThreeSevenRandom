name: Build Android APK

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Run pure Java rule tests
        shell: bash
        run: |
          rm -rf build/pure-java-tests
          mkdir -p build/pure-java-tests
          javac -d build/pure-java-tests \
            app/src/main/java/com/fonuhuo/sevenrandom/RandomEngine.java \
            tools/test/com/fonuhuo/sevenrandom/RandomEngineTest.java
          java -cp build/pure-java-tests com.fonuhuo.sevenrandom.RandomEngineTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare named APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ThreeSevenRandom.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThreeSevenRandom-apk
          path: dist/ThreeSevenRandom.apk
          if-no-files-found: error
          retention-days: 30
